name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: workout
          POSTGRES_DB: workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workout -d workout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://workout:workout@127.0.0.1:5432/workout_test
      DATABASE_URL_TEST: postgres://workout:workout@127.0.0.1:5432/workout_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply test database migrations
        run: npm run db:migrate:test

      - name: Run database tests
        run: npm run test:db

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed browser smoke user
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into users (id, name) values (999, 'E2E') on conflict (id) do update set name = excluded.name"

      - name: Run mobile browser smoke tests
        env:
          AUTH_DEV_USER_ID: "999"
        run: npm run test:e2e
