name: Publish deploy images

on:
  workflow_dispatch:
  push:
    branches:
      - agent/telegram-miniapp-deploy
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - app/**
      - server/**
      - drizzle/**
      - deploy/**
      - nuxt.config.ts
      - .github/workflows/publish-deploy-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            image: app
          - target: tools
            image: migrate
          - target: backup
            image: backup
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true
